# 基础元素库 v1.0
# 由 ppt-layout 与 ppt-visual 共用；按 use_cases 标签取用，不按外观临时发挥。

lines:
  L-01: { appearance: disconnected_solid, segments_mm: [180, 15, 62], use_cases: [global_header, h1_guide_line] }
  L-02: { appearance: thin_light_gray, use_cases: [block_divider, table_row] }
  L-03: { appearance: thick_solid, use_cases: [text_emphasis, h1_underline, critical_conclusion] }
  L-04: { appearance: thick_vertical, use_cases: [h1_guide, quote_line] }
  L-05: { appearance: dashed_gray, use_cases: [soft_divider] }

shapes:
  S-01: { appearance: full_width_solid_dark, use_cases: [top_summary, h1_block] }
  S-02: { appearance: full_width_solid_light, use_cases: [soft_summary] }
  S-03: { appearance: light_gray_no_border, use_cases: [callout_box, case_study, note_box] }
  S-04: { appearance: bordered_rect, use_cases: [kpi_card, chart_container] }
  S-05: { appearance: rounded_rect, use_cases: [flow_node, tag, button_like] }

text_effects:
  T-01: { appearance: bold, use_cases: [inline_emphasis, key_term] }
  T-02: { appearance: accent_color, use_cases: [key_number, proper_noun] }
  T-03: { appearance: underline, use_cases: [critical_conclusion] }
  T-04: { appearance: highlight_bg, use_cases: [long_text_emphasis] }

marks:
  I-01: { appearance: dot, use_cases: [unordered_list] }
  I-03: { appearance: number, use_cases: [ordered_list, insight_points, steps] }
  I-04: { appearance: check_cross, use_cases: [pros_cons, evaluation] }

tables:
  TBL-01:
    header: { bold: true, bg: "#F2F2F2", bottom_border: thick }
    body: { border: horizontal_only, size_pt: [9, 10] }
    align: { text: left, number: right }

charts:
  CH-01:
    grid: horizontal_only
    grid_color: "#E0E0E0"
    outer_border: none
    title_in_chart: false
    legend_position: top_right
    legend_max: 4
    accent_for_key_data: true

rules:
  emphasis_max_per_page: 2
  no_invented_colors: true
  no_invented_fonts: true
